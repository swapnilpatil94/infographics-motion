name: Technical Data Cinema Smoke Test

on:
  push:
    branches:
      - feat/technical-data-cinema
    paths:
      - "modes/technical-data-cinema/**"
      - ".github/workflows/technical-data-cinema.yml"
  pull_request:
    paths:
      - "modes/technical-data-cinema/**"
      - ".github/workflows/technical-data-cinema.yml"
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: modes/technical-data-cinema
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install npm dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Syntax check
        run: |
          node --check scripts/generate.mjs
          node --check scripts/fallback-scene.mjs
          node --check scripts/test-fallback-scene.mjs
          node --check scripts/test-fallback-render.mjs
          node --check scripts/test-three-bundle.mjs
          node --check scripts/build-visual-benchmark.mjs
          node --check scripts/ollama-session.mjs
          node --check scripts/render.mjs
          node --check scripts/export.mjs
          node --check scripts/ui-server.mjs
          node --check scripts/doctor.mjs
          python3 -m py_compile ../../engine/studio/server.py ../../engine/shorts/voice.py ../../tools/chatterbox_tts.py ../../tools/whisper_align.py
      - name: Deterministic fallback scene contract test
        run: npm run test:fallback
      - name: Browser-level fallback scene and safe-area test
        run: npm run test:fallback:render
      - name: Three.js offline bundle and deterministic render test
        run: npm run test:three
      - name: Render deterministic smoke test
        run: npm run test:smoke
      - name: Build and render cinematic dotted-scene benchmark
        run: npm run test:visual-benchmark
      - name: Upload smoke-test and visual benchmark MP4s
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technical-data-cinema-visual-benchmarks
          path: |
            modes/technical-data-cinema/output/smoke-test.mp4
            modes/technical-data-cinema/output/visual-director-benchmark.mp4
          if-no-files-found: ignore
          retention-days: 7
